name: CI - Feature to Dev

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'src/**'
      - 'dags/**'
      - 'requirements.txt'
      - '.github/workflows/**'
      - '**/*.md'
      - '**/*.py'
      - 'scripts/**'

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint black pytest pytest-cov
      
      - name: Lint with pylint
        continue-on-error: true
        run: |
          pylint src/ --exit-zero --output-format=text || true
      
      - name: Format check with black
        run: |
          black --check src/ dags/ || true
      
      - name: Run unit tests (if tests exist)
        continue-on-error: true
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v --cov=src --cov-report=xml || true
          else
            echo "No tests directory found, skipping tests"
          fi
      
      - name: Check DAG syntax
        run: |
          python -m py_compile dags/*.py || echo "DAG syntax check completed"
      
      - name: Validate imports
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from data.extract import extract_binance_data; print('✅ Imports valid')" || echo "⚠️ Import validation skipped"

