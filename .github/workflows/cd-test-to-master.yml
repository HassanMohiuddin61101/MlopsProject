name: CD - Test to Master (Production Deployment)

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'dags/**'
      - 'model/**'
      - 'Dockerfile*'
      - '.github/workflows/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Fetch Model from MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        run: |
          python scripts/fetch_model_from_mlflow.py || echo "Model fetch completed"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub (if credentials provided)
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Docker image
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mlops-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/mlops-api:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mlops-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mlops-api:buildcache,mode=max
      
      - name: Build Docker image (local test only)
        if: ${{ secrets.DOCKER_USERNAME == '' }}
        run: |
          echo "Docker Hub credentials not set, building locally only"
      
      - name: Test Docker image locally
        run: |
          docker build -f Dockerfile.api -t mlops-api:test .
          docker run -d -p 8000:8000 --name mlops-api-test mlops-api:test || true
          sleep 10
          curl -f http://localhost:8000/health || echo "Health check failed"
          docker stop mlops-api-test || true
          docker rm mlops-api-test || true
      
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image**: Built successfully" >> $GITHUB_STEP_SUMMARY
          if [ "${{ secrets.DOCKER_USERNAME }}" != "" ]; then
            echo "- **Docker Hub**: ${{ secrets.DOCKER_USERNAME }}/mlops-api:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          fi

